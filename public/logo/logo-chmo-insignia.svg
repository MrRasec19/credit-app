<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;display=swap');
      .logo-text { font-family: 'Montserrat', Arial, sans-serif; font-weight: 700; fill: #c9a84c; }
    </style>
  </defs>
  <rect x="20" y="20" width="360" height="360" rx="60" fill="#141414"/>
  <rect x="30" y="30" width="340" height="340" rx="50" fill="none" stroke="#c9a84c" stroke-width="6"/>
  <text x="200" y="185" text-anchor="middle" class="logo-text" font-size="140">CH</text>
  <text x="200" y="300" text-anchor="middle" class="logo-text" font-size="140">MO</text>
